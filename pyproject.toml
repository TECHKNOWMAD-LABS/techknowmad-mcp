[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "techknowmad-mcp"
version = "0.1.0"
description = "TechKnowmad MCP Server Monorepo — 8 autonomous development cycles by Edgecraft Protocol"
authors = [
    {name = "TechKnowMad Labs", email = "admin@techknowmad.ai"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
keywords = ["mcp", "ai", "agents", "edgecraft", "benchmark", "knowledge-graph", "evolution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["servers"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--import-mode=importlib"

[tool.hatch.build.targets.wheel]
packages = ["servers"]

[dependency-groups]
dev = [
    "hypothesis>=6.151.9",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
]
